# Render Blueprint - https://render.com/docs/blueprint-spec
#
# This file is the source of truth for the deployment. Adopt it from the Render
# dashboard with New > Blueprint > Connect, and Render applies this configuration
# to the existing rag-chat-bot-build service by name and redeploys it. That is
# the only supported way to set a start command from the repo - Render ignores
# Procfiles and does no framework autodetection for Python.
#
# data/chroma/ is gitignored, so Render receives the corpus but NOT the vector
# index. The build command therefore constructs the index from the committed
# snapshots in data/raw/ + data/processed/chunks.jsonl. It deliberately avoids
# "--rebuild", which re-scrapes all 10 documents and fails on the HDFC 403s.
#
# The build command re-runs on every deploy, so the index is rebuilt each time
# despite Render's ephemeral filesystem.

services:
  - type: web
    # This MUST match the name of the service that already exists in the Render
    # dashboard. On Blueprint sync, Render matches existing resources by name and
    # then applies this file's configuration to them - which is what preserves the
    # rag-chat-bot-build.onrender.com URL instead of creating a second, suffixed
    # service. Renaming it here would orphan the current service.
    name: rag-chat-bot-build
    repo: https://github.com/stark-21/RAG-CHAT-BOT-Build
    runtime: python
    plan: free # bump to "starter" if the instance is OOM-killed on boot

    # PYTHON_VERSION is intentionally left unset: Render's default resolved to
    # 3.14 during testing, and the local interpreter that passes all 388 tests
    # is also 3.14.2 (torch-2.14.0+cpu, cp314 wheels).
    rootDir: # repository root - src/, data/ and requirements.txt all live here

    buildCommand: >-
      pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      && pip install --no-cache-dir -r requirements.txt
      && python -m src.ingest.build_index --stage embed
      && python -m src.ingest.build_index --stage store

    # THIS MUST BE SET, and it is what an empty Start Command field breaks.
    # Render does not autodetect frameworks for Python services and ignores
    # Procfiles entirely ("no Procfile, no buildpack autodetection magic" - Render
    # docs). Left blank, it falls back to a FastAPI-shaped default:
    #   Running 'uvicorn src.app:app --host 0.0.0.0 --port $PORT'
    #   ERROR: Error loading ASGI app. Attribute "app" not found in module "src.app"
    #   Exited with status 3
    # because src/app.py is a Streamlit script with no ASGI "app" object.
    #
    # "python -m streamlit" is also deliberate rather than bare "streamlit":
    # -m prepends the working directory to sys.path. src/app.py additionally
    # seeds the repo root itself, so either form now works.
    startCommand: >-
      PYTHONPATH=. python -m streamlit run src/app.py --server.port $PORT --server.address 0.0.0.0

    healthCheckPath: /_stcore/health

    # All values below match the defaults already in src/config.py; they are
    # pinned here so the deployed behaviour is explicit and reproducible.
    envVars:
      - key: HF_HOME
        value: ./.cache/hf # keep the model cache inside the project
      - key: LLM_PROVIDER
        value: stub # offline; switch to "hosted" + LLM_API_KEY for a real LLM
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHROMA_DIR
        value: data/chroma
      - key: COLLECTION_NAME
        value: mf_faq
      - key: TOP_K
        value: "10"
      - key: MIN_SIMILARITY
        value: "0.30"
      - key: DISCLAIMER
        value: "Facts-only. No investment advice."

    autoDeploy: true
